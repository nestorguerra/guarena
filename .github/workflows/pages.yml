# Publica el juego (un solo archivo HTML) en GitHub Pages cada vez que se sube algo a main.
# Si existe la variable de repositorio GUARENA_MP_URL (el servidor multijugador), la pantalla Multijugador enlaza con él.
name: Publicar el juego en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Empaquetar el juego
        env:
          GUARENA_MP_URL: ${{ vars.GUARENA_MP_URL }}
        run: |
          python3 tools/build.py
          mkdir -p _site
          cp dist/test.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
